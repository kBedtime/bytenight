# Settings for Scripts/update.sh. Edit, then run it.

# Where this folder will be served from, without a trailing slash (e.g. https://repo.example.com).
# Left empty, packages are built without Icon/SileoDepiction fields and depictions aren't linked.
REPO_URL=https://kbedtime.github.io/bytenight

# Lisa's source checkout; its Scripts/BuildDeb.sh builds the Lisa package.
LISA_SRC=../Lisa3

# Ammonia's GitHub repository; the newest release's ammonia.pkg is wrapped.
AMMONIA_GITHUB=MachLiberation/Ammonia

ORIGIN="Bedtime's Repository"
LABEL="Bedtime's Repository"
DESCRIPTION="Ammonia, Lisa and other tweaks for macOS"

# GPG key that signs Release (InRelease, Release.gpg). Its public half is published as key.gpg.
# The private key is in this Mac's ~/.gnupg; back it up, or a new key means users re-trust the repo.
SIGNING_KEY=CFBBD4CCA5B2C394D1846D68B5084C1CB18065A5

# Featured banners (sileo-featured.json), made by Lisa's Scripts/Promo/compose.py.
# Each name is a theme; its banner opens the Lisa package.
FEATURED_THEMES="Synth Celadon Lacquer Blueprint Aurora"
